# R1 — VyOS 1.5-stream-2025-Q2 configuration commands (S = 103)
# Enter with: configure -> paste -> compare -> commit -> save

set system host-name 'R1'
set interfaces ethernet eth4 address '192.168.103.11/24'
set interfaces ethernet eth4 description 'e3-MGMT-to-ODL'
set interfaces ethernet eth5 address '10.103.0.1/30'
set interfaces ethernet eth5 description 'e0-to-R2'
set interfaces ethernet eth6 address '10.103.0.13/30'
set interfaces ethernet eth6 description 'e1-to-R4'
set interfaces ethernet eth7 address '10.103.0.17/30'
set interfaces ethernet eth7 description 'e2-to-R3'
set interfaces loopback lo address '10.103.0.201/32'

# IS-IS: one area, point-to-point core links, passive loopback
set protocols isis net '49.0001.0000.0000.0001.00'
set protocols isis interface eth4 passive
set protocols isis interface eth5 network point-to-point
set protocols isis interface eth6 network point-to-point
set protocols isis interface eth7 network point-to-point
set protocols isis interface lo passive

# Advanced feature D: wide metrics + traffic-engineering TLVs
set protocols isis metric-style 'wide'
set protocols isis traffic-engineering enable
set protocols isis traffic-engineering address '10.103.0.201'

# Advanced feature B: read-only SNMPv2c, management LAN only
set service snmp community ga01ro authorization 'ro'
set service snmp community ga01ro network '192.168.103.0/24'

# iBGP to OpenDaylight on TCP 1790 (ODL is passive, R1 initiates)
set protocols bgp system-as '65002'
set protocols bgp parameters router-id '10.103.0.201'
set protocols bgp neighbor 192.168.103.10 remote-as '65002'
set protocols bgp neighbor 192.168.103.10 port '1790'
set protocols bgp neighbor 192.168.103.10 update-source '192.168.103.11'
set protocols bgp neighbor 192.168.103.10 description 'ODL-controller'
set protocols bgp neighbor 192.168.103.10 address-family ipv4-unicast
set protocols bgp address-family ipv4-unicast network 10.103.0.201/32
