# Advanced feature A: temporary 10 Mbit/s egress shaper on R1 eth5 (removed after the test)
set qos policy shaper GA01-LIMIT bandwidth '10mbit'
set qos policy shaper GA01-LIMIT default bandwidth '100%'
set qos interface eth5 egress 'GA01-LIMIT'

# Test (iperf3 on the routers):
#   R2:  iperf3 -s
#   R1:  iperf3 -c 10.103.0.2 -B 10.103.0.1 -u -b 8M -t 10      (repeat at 2, 5, 8, 10, 12, 15M)

# Remove after testing:
# delete qos interface eth5
